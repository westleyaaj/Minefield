    <script>

        //window.ontouchstart = initWebAudio();

        function initWebAudio() {
            var AudioContext = window.AudioContext || window.webkitAudioContext;

            var context = new AudioContext();

            webAudioTouchUnlock(context).then(function (unlocked) {
                if (unlocked) {
                    // AudioContext was unlocked from an explicit user action,
                    // sound should start playing now
                    console.log("ios");
                }
                else {
                    // There was no need for unlocking, devices other than iOS
                    console.log("other");
                    window.removeEventListener('touchstart', initWebAudio);
                    window.removeEventListener('touchend', initWebAudio);
                }
            },

                function (reason) {
                    console.error(reason);
                });
        }

        function webAudioTouchUnlock(context) {
            return new Promise(function (resolve, reject) {
                console.log("promise");
                if (context.state === 'suspended' && 'ontouchstart' in window) {
                    var unlock = function () {
                        context.resume().then(function () {
                            document.body.removeEventListener('touchstart', unlock);
                            document.body.removeEventListener('touchend', unlock);

                            resolve(true);
                        },
                            function (reason) {
                                reject(reason);
                            });
                    };

                    document.body.addEventListener('touchstart', unlock, false);
                    document.body.addEventListener('touchend', unlock, false);
                }
                else {
                    resolve(false);
                }
            });
        }
    </script>
